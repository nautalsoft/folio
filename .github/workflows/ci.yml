name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the self-host stack
        run: docker compose up -d --build --wait
      - name: The demo library answers
        run: |
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:3000/api/health
          test "$(curl -s http://localhost:3000/api/library | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["books"]) > 0)')" = "True"
      - if: always()
        run: docker compose logs --no-color | tail -100
